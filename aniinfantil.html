<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Galeria de Fotografias</title>

  <style>
    /* Secção da galeria */
    .gallery-section {
      width: 100%;
      max-width: 1160px;
      margin: 0 auto;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    .gallery-section h2 {
      text-align: center;
      margin-bottom: 10px;
    }

    .gallery-intro {
      text-align: center;
      margin-bottom: 28px;
    }

    /* Grelha de fotografias */
    .photo-gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    /* Cada fotografia */
    .gallery-item {
      display: block;
      overflow: hidden;
      border-radius: 12px;
      aspect-ratio: 4 / 3;
      background: #f3edf5;
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    /* Efeito ao passar o rato */
    .gallery-item:hover img {
      transform: scale(1.06);
    }

    /* Tablets */
    @media (max-width: 800px) {
      .photo-gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
    }

    /* Telemóveis */
    @media (max-width: 480px) {
      .photo-gallery {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .gallery-section {
        padding: 28px 16px;
      }
    }
  </style>
</head>

<body>

  <section class="gallery-section">
    <h2>Galeria de Fotografias</h2>

    <p class="gallery-intro">
      Descobre alguns dos nossos momentos especiais.
    </p>

    <div class="photo-gallery">

      <a href="images/photo1.jpg"
         class="gallery-item" target="_blank">
        <img src="images/photo1.jpg"
             alt="Festa de aniversário">
      </a>

      <a href="images/photo2.jpg"
         class="gallery-item" target="_blank">
        <img src="images/photo2.jpg"
             alt="Decoração de festa">
      </a>

      <a href="images/photo3.jpg"
         class="gallery-item" target="_blank">
        <img src="images/photo3.jpg"
             alt="Atividade criativa">
      </a>

      <a href="images/photo4.jpg"
         class="gallery-item" target="_blank">
        <img src="images/photo4.jpg"
             alt="Decoração colorida">
      </a>

      <a href="images/photo5.jpg"
         class="gallery-item" target="_blank">
        <img src="images/photo5.jpg"
             alt="Celebração especial">
      </a>

      <a href="images/photo6.jpg"
         class="gallery-item" target="_blank">
        <img src="images/photo6.jpg"
             alt="Momentos divertidos">
      </a>

    </div>
  </section>

</body>
</html>


</body>
