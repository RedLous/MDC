<!doctype html>
<html lang="pt-PT">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Galeria de Logótipos · Magia das Cores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root{--blue:#64b6bf;--ink:#29345f;--paper:#fffdfb;--shadow:0 20px 60px rgba(40,20,60,0.12)}
        *{box-sizing:border-box}
        body{margin:0;font-family:Nunito,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink)}
        .container{width:min(1100px,calc(100% - 40px));margin:28px auto}
        .brand{font-family:'Baloo 2',cursive}
        h1{font-family:'Baloo 2',cursive}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:18px}
        .tile{background:#fff;border:1px solid #f0e8f4;border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
        .tile img{width:100%;height:220px;object-fit:contain;background:#fff;padding:20px}
        .label{padding:10px;font-weight:800;color:#4b3a5a}
        .back{display:inline-block;margin-top:12px;text-decoration:none;color:var(--ink);font-weight:800}
        .lb{position:fixed;inset:0;background:rgba(6,6,8,0.7);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
        .lb.is-open{display:flex}
        .lb-inner{max-width:900px;width:100%;background:#fff;border-radius:12px;overflow:hidden;position:relative}
        .lb-inner img{width:100%;height:auto;display:block}
        .lb-close{position:absolute;right:14px;top:14px;background:#fff;border:0;padding:8px 10px;border-radius:8px;font-weight:900}
    </style>
</head>
<body>
    <div class="container">
        <div style="display:flex;justify-content:space-between;align-items:center">
            <h1 class="brand">Galeria de Logótipos</h1>
            <a class="back" href="index.html">← Voltar</a>
        </div>
        <p style="color:#6b7188">Galeria de variantes do logótipo e aplicações. Clique para ampliar.</p>

        <div class="grid">
            <div class="tile"><img src="logomdc.png" alt="Logótipo — versão principal"><div class="label">Logótipo — versão principal</div></div>
            <div class="tile"><img src="vazio.jpg" alt="Logótipo — negativo / placeholder"><div class="label">Logótipo — negativo (placeholder)</div></div>
            <div class="tile"><img src="logomdc.png" alt="Logótipo — ícone"><div class="label">Ícone do logótipo</div></div>
            <div class="tile"><img src="vazio.jpg" alt="Marca de aplicação"><div class="label">Marca de aplicação (placeholder)</div></div>
        </div>
    </div>

    <div id="lightbox" class="lb" role="dialog" aria-hidden="true">
        <div class="lb-inner">
            <button class="lb-close" id="lbClose">✕</button>
            <img id="lbImg" src="" alt="Ampliação">
        </div>
    </div>

    <script>
        (function(){
            const imgs = document.querySelectorAll('.tile img');
            const lb = document.getElementById('lightbox');
            const lbImg = document.getElementById('lbImg');
            const lbClose = document.getElementById('lbClose');
            imgs.forEach(i => i.addEventListener('click', ()=>{
                lbImg.src = i.src; lb.classList.add('is-open'); lb.setAttribute('aria-hidden','false');
            }));
            lbClose.addEventListener('click', ()=>{ lb.classList.remove('is-open'); lb.setAttribute('aria-hidden','true'); lbImg.src='';});
            lb.addEventListener('click',(e)=>{ if(e.target===lb){ lb.classList.remove('is-open'); lb.setAttribute('aria-hidden','true'); lbImg.src=''; } });
            document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape'){ lb.classList.remove('is-open'); lb.setAttribute('aria-hidden','true'); lbImg.src=''; } });
        })();
    </script>
</body>
</html>
